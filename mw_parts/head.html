<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>MossyWoss OS</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<style>
/* ===== RESET ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0a12;color:#e8e8f0;user-select:none;-webkit-user-select:none}
input,textarea,select{font-family:inherit;outline:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
canvas{touch-action:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:rgba(255,255,255,0.03)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.25)}

/* ===== CSS VARIABLES (Theme) ===== */
:root{
--bg:#0a0a12;--surface:rgba(20,20,30,0.85);--surface2:rgba(28,28,42,0.9);
--accent:#ff8c00;--accent2:#ff6b00;--accent-text:#fff;
--text:#e8e8f0;--text2:#8888a0;--text3:#555568;
--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.04);
--glass:rgba(20,20,30,0.75);--glass2:rgba(20,20,30,0.6);
--radius:10px;--radius-sm:6px;--radius-lg:16px;
--shadow:0 8px 32px rgba(0,0,0,0.5);--shadow-sm:0 2px 8px rgba(0,0,0,0.3);
--blur:saturate(180%) blur(20px);
--taskbar-h:48px;--titlebar-h:34px;
}

/* ===== BOOT SCREEN ===== */
.mw-boot{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a12,#16162a)}
.mw-bios{position:fixed;inset:0;z-index:99998;background:#000;color:#0f0;font-family:"Courier New",monospace;font-size:13px;padding:24px;white-space:pre;line-height:1.65;overflow:hidden}
.mw-bootlogo{position:fixed;inset:0;z-index:99997;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a12,#16162a)}
.mw-bootlogo-text{font-size:2.5em;font-weight:700;background:linear-gradient(135deg,var(--accent),#ffaa44);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:28px}
.mw-bootlogo-spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:mw-spin .8s linear infinite}
@keyframes mw-spin{to{transform:rotate(360deg)}}
.mw-bootlogo-sub{margin-top:18px;color:var(--text2);font-size:0.85em}

/* ===== DESKTOP ===== */
.mw-desktop{position:fixed;inset:0;overflow:hidden;z-index:1}
.mw-wallpaper{position:absolute;inset:0;z-index:0}
.mw-wallpaper canvas{width:100%;height:100%;display:block}
.mw-shortcuts{position:absolute;top:16px;left:16px;z-index:2;display:grid;grid-template-columns:repeat(auto-fill,84px);gap:8px;max-height:calc(100% - 80px)}
.mw-shortcut{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:var(--radius);cursor:pointer;transition:background .15s;width:84px}
.mw-shortcut:active{background:rgba(255,140,0,0.15)}
.mw-shortcut svg{width:36px;height:36px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}
.mw-shortcut span{font-size:0.72em;color:var(--text);text-shadow:0 1px 3px rgba(0,0,0,0.8);text-align:center;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== TASKBAR ===== */
.mw-taskbar{position:fixed;bottom:0;left:0;right:0;height:var(--taskbar-h);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:6px;z-index:9000}
.mw-start-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.mw-start-btn:active{background:rgba(255,140,0,0.25)}
.mw-start-btn svg{width:20px;height:20px}
.mw-taskbar-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;height:100%;align-items:center}
.mw-taskbar-tabs::-webkit-scrollbar{display:none}
.mw-taskbar-tab{height:34px;padding:0 8px 0 10px;border-radius:6px;background:rgba(255,255,255,0.05);border:1px solid transparent;display:flex;align-items:center;gap:6px;font-size:0.8em;white-space:nowrap;transition:all .15s;max-width:180px;cursor:pointer}
.mw-taskbar-tab:active,.mw-taskbar-tab.active{background:rgba(255,140,0,0.15);border-color:rgba(255,140,0,0.3)}
.mw-taskbar-tab svg{width:16px;height:16px;flex-shrink:0}
.mw-taskbar-tab .tab-title{overflow:hidden;text-overflow:ellipsis;max-width:100px}
.mw-taskbar-tab .tab-close{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.85em;opacity:0.6;transition:all .15s}
.mw-taskbar-tab .tab-close:active{opacity:1;background:rgba(244,67,54,0.4)}
.mw-taskbar-tab .tab-close svg{width:12px;height:12px}
.mw-taskbar-clock{font-size:0.8em;padding:0 8px;white-space:nowrap;color:var(--text)}

/* ===== START MENU ===== */
.mw-start-menu{position:fixed;bottom:52px;left:10px;width:380px;max-width:calc(100vw - 20px);max-height:72vh;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);z-index:9001;display:flex;flex-direction:column;overflow:hidden}
.mw-start-search{padding:12px;border-bottom:1px solid var(--border)}
.mw-start-search input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.9em}
.mw-start-categories{display:flex;gap:2px;padding:8px 12px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.mw-start-categories::-webkit-scrollbar{display:none}
.mw-start-cat{padding:6px 12px;border-radius:6px;font-size:0.78em;white-space:nowrap;transition:background .15s;cursor:pointer}
.mw-start-cat:active,.mw-start-cat.active{background:rgba(255,140,0,0.2)}
.mw-start-apps{overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mw-start-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:10px;transition:background .15s;cursor:pointer;text-align:center}
.mw-start-app:active{background:rgba(255,140,0,0.12)}
.mw-start-app svg{width:30px;height:30px}
.mw-start-app span{font-size:0.73em;color:var(--text)}

/* ===== WINDOWS ===== */
.mw-window{position:absolute;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:240px;min-height:140px}
.mw-window.maximized{border-radius:0;width:100vw!important;height:calc(100vh - var(--taskbar-h))!important;top:0!important;left:0!important}
.mw-win-titlebar{height:var(--titlebar-h);background:rgba(28,28,42,0.95);display:flex;align-items:center;padding:0 8px;gap:8px;cursor:grab;flex-shrink:0;border-bottom:1px solid var(--border)}
.mw-win-titlebar:active{cursor:grabbing}
.mw-win-icon{width:18px;height:18px;flex-shrink:0}
.mw-win-title{font-size:0.82em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw-win-btns{display:flex;gap:4px}
.mw-win-btn{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;opacity:0.7;transition:all .12s}
.mw-win-btn:active{opacity:1;background:rgba(255,255,255,0.1)}
.mw-win-btn.close:active{background:rgba(244,67,54,0.5);opacity:1}
.mw-win-btn svg{width:14px;height:14px}
.mw-win-body{flex:1;overflow:auto;position:relative;background:rgba(14,14,22,0.6)}
.mw-win-resize{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;z-index:10}

/* ===== GENERIC APP STYLES ===== */
.mw-app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.mw-toolbar{padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.2)}
.mw-btn{padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text);font-size:0.8em;display:flex;align-items:center;gap:5px;transition:all .12s}
.mw-btn:active{background:rgba(255,140,0,0.2)}
.mw-btn svg{width:16px;height:16px}
.mw-btn.primary{background:var(--accent);color:var(--accent-text);border:none}
.mw-btn.primary:active{background:var(--accent2)}
.mw-btn.danger{background:rgba(244,67,54,0.15);color:#f44336;border-color:rgba(244,67,54,0.3)}
.mw-input{padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.85em}
.mw-select{padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.8em}

/* ===== FILE MANAGER ===== */
.mw-fm{display:flex;height:100%}
.mw-fm-side{width:160px;border-right:1px solid var(--border);padding:6px 0;overflow-y:auto;flex-shrink:0}
.mw-fm-side-item{padding:8px 12px;font-size:0.84em;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .12s}
.mw-fm-side-item:active,.mw-fm-side-item.active{background:rgba(255,140,0,0.12)}
.mw-fm-side-item svg{width:16px;height:16px;flex-shrink:0}
.mw-fm-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.mw-fm-path{font-size:0.78em;color:var(--text2);padding:4px 8px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw-fm-list{flex:1;overflow-y:auto;padding:6px}
.mw-fm-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;cursor:pointer;transition:background .12s}
.mw-fm-item:active{background:rgba(255,140,0,0.12)}
.mw-fm-item svg{width:20px;height:20px;flex-shrink:0}
.mw-fm-item .fm-name{flex:1;font-size:0.84em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw-fm-item .fm-size{font-size:0.76em;color:var(--text2)}
.mw-fm-empty{padding:24px;color:var(--text2);font-size:0.85em;text-align:center}

/* ===== CODE STUDIO ===== */
.mw-code{display:flex;flex-direction:column;height:100%}
.mw-code-editor{flex:1;display:flex;overflow:hidden;position:relative}
.mw-code-lines{width:42px;text-align:right;padding:8px 6px 8px 0;font-family:monospace;font-size:13px;line-height:1.5;color:var(--text3);overflow:hidden;user-select:none;flex-shrink:0}
.mw-code-area{flex:1;position:relative;overflow:hidden}
.mw-code-input{position:absolute;inset:0;width:100%;height:100%;border:none;background:transparent;color:transparent;font-family:monospace;font-size:13px;line-height:1.5;padding:8px;resize:none;caret-color:var(--accent);white-space:pre;overflow:auto;user-select:text}
.mw-code-display{position:absolute;inset:0;font-family:monospace;font-size:13px;line-height:1.5;padding:8px;white-space:pre;overflow:auto;pointer-events:none}
.tk-c{color:#6a9955}.tk-s{color:#ce9178}.tk-k{color:#569cd6}.tk-n{color:#b5cea8}.tk-f{color:#dcdcaa}.tk-tag{color:#569cd6}.tk-attr{color:#9cdcfe}.tk-val{color:#ce9178}.tk-key{color:#c586c0}

/* ===== BROWSER ===== */
.mw-browser{display:flex;flex-direction:column;height:100%}
.mw-browser-bar{padding:6px 8px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.2)}
.mw-browser-bar button{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .12s}
.mw-browser-bar button:active{background:rgba(255,255,255,0.08);color:var(--text)}
.mw-browser-bar input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.84em}
.mw-browser-frame{flex:1;border:none;background:#fff;width:100%}
.mw-browser-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text2)}

/* ===== GAME STUDIO ===== */
.mw-gs{display:flex;flex-direction:column;height:100%}
.mw-gs-viewport{flex:1;position:relative;overflow:hidden;min-height:200px}
.mw-gs-viewport canvas{width:100%;height:100%;display:block;outline:none}
.mw-gs-panel{width:220px;border-left:1px solid var(--border);overflow-y:auto;padding:10px;flex-shrink:0;background:rgba(0,0,0,0.2)}
.mw-gs-panel h4{font-size:0.8em;color:var(--text2);margin:10px 0 6px;text-transform:uppercase;letter-spacing:0.5px}
.mw-gs-prop{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:0.78em}
.mw-gs-prop label{width:50px;color:var(--text2)}
.mw-gs-prop input{width:50px;padding:3px 6px;border-radius:4px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.9em;font-family:monospace}
.mw-gs-body{flex:1;display:flex;overflow:hidden}

/* ===== NODE STUDIO ===== */
.mw-ns{width:100%;height:100%;position:relative;overflow:hidden;background:rgba(10,10,16,0.6)}
.mw-ns svg{width:100%;height:100%;display:block;cursor:grab}
.mw-ns svg:active{cursor:grabbing}
.mw-ns-node{cursor:move}
.mw-ns-node rect{fill:rgba(28,28,42,0.95);stroke:rgba(255,255,255,0.15);stroke-width:1;rx:6}
.mw-ns-node text{fill:var(--text);font-size:11px;font-family:monospace}
.mw-ns-node circle{fill:var(--accent);stroke:#fff;stroke-width:1}
.mw-ns-conn{stroke:var(--accent);stroke-width:2;fill:none;opacity:0.7}

/* ===== PAINT ===== */
.mw-paint{display:flex;flex-direction:column;height:100%}
.mw-paint-canvas{flex:1;cursor:crosshair;touch-action:none}
.mw-paint-tools{padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.mw-color-grid{display:grid;grid-template-columns:repeat(8,20px);gap:2px}
.mw-color-cell{width:20px;height:20px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.mw-color-cell.selected{border-color:#fff;transform:scale(1.15)}

/* ===== TERMINAL ===== */
.mw-term{height:100%;background:#0a0a0a;color:#0f0;font-family:monospace;font-size:13px;padding:10px;overflow-y:auto;line-height:1.5}
.mw-term-line{white-space:pre-wrap;word-break:break-all}
.mw-term-input{display:flex;align-items:center;gap:4px}
.mw-term-input span{color:#0f0}
.mw-term-input input{flex:1;background:transparent;border:none;color:#0f0;font-family:monospace;font-size:13px;caret-color:#0f0}

/* ===== SETTINGS ===== */
.mw-settings{padding:20px;overflow-y:auto;height:100%}
.mw-settings h3{font-size:0.9em;color:var(--text2);margin:18px 0 10px;text-transform:uppercase;letter-spacing:1px}
.mw-settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border2)}
.mw-settings-row label{font-size:0.88em}

/* ===== VIDEO MAKER ===== */
.mw-vm{display:flex;flex-direction:column;height:100%}
.mw-vm-timeline{height:160px;border-top:1px solid var(--border);background:rgba(0,0,0,0.3);overflow-x:auto;overflow-y:auto;padding:4px}
.mw-vm-track{height:36px;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:1px solid var(--border2)}
.mw-vm-track-label{width:60px;font-size:0.72em;color:var(--text2);flex-shrink:0}
.mw-vm-clip{height:28px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:0.72em;color:#fff;cursor:move;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:40px}

/* ===== ANALYTICS ===== */
.mw-analytics{padding:16px;overflow-y:auto;height:100%}
.mw-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.mw-stat-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.mw-stat-card .stat-label{font-size:0.75em;color:var(--text2);margin-bottom:4px}
.mw-stat-card .stat-value{font-size:1.4em;font-weight:600}
.mw-stat-card .stat-delta{font-size:0.72em;margin-top:2px}
.mw-stat-card .stat-delta.up{color:#4caf50}
.mw-stat-card .stat-delta.down{color:#f44336}

/* ===== STORE ===== */
.mw-store{padding:16px;overflow-y:auto;height:100%}
.mw-store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mw-store-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px}
.mw-store-card svg{width:40px;height:40px}
.mw-store-card h4{font-size:0.9em}
.mw-store-card p{font-size:0.76em;color:var(--text2);flex:1}
.mw-store-card .store-btn{padding:6px;border-radius:6px;background:var(--accent);color:#fff;font-size:0.78em;text-align:center}
.mw-store-card .store-btn.installed{background:rgba(76,175,80,0.2);color:#4caf50}

/* ===== DIAGNOSTICS ===== */
.mw-diag{padding:16px;overflow-y:auto;height:100%}
.mw-diag-item{background:rgba(244,67,54,0.08);border:1px solid rgba(244,67,54,0.2);border-radius:8px;padding:12px;margin-bottom:10px}
.mw-diag-item .diag-msg{color:#f44336;font-size:0.85em;font-family:monospace;margin-bottom:6px}
.mw-diag-item .diag-source{color:var(--text2);font-size:0.76em;margin-bottom:6px}
.mw-diag-item .diag-fix{color:#4caf50;font-size:0.8em;line-height:1.5}
.mw-diag-code{background:#1a1a2e;border:1px solid var(--border);border-radius:6px;padding:8px;font-family:monospace;font-size:12px;overflow-x:auto;margin:6px 0}

/* ===== MODAL ===== */
.mw-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9700;display:flex;align-items:center;justify-content:center}
.mw-modal{background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;min-width:300px;max-width:90vw;box-shadow:var(--shadow)}
.mw-modal h3{font-size:1.1em;margin-bottom:14px}
.mw-modal input{width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.9em;margin-bottom:14px}
.mw-modal-btns{display:flex;gap:8px;justify-content:flex-end}

/* ===== NOTIFICATION ===== */
.mw-notif{position:fixed;top:16px;right:16px;background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;box-shadow:var(--shadow);z-index:9600;font-size:0.86em;animation:mw-slide .3s ease}
@keyframes mw-slide{from{transform:translateX(120%)}to{transform:translateX(0)}}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
.mw-fm-side{display:none}
.mw-start-menu{width:calc(100vw - 20px)}
.mw-gs-panel{width:160px}
.mw-shortcuts{grid-template-columns:repeat(auto-fill,72px)}
.mw-shortcut{width:72px}
}
@media(max-width:400px){
.mw-taskbar-tab .tab-title{display:none}
.mw-taskbar-tab{padding:0 8px}
}
</style>
</head>
<body>
<div id="mw-root"></div>
<!-- MW_PARTS_CORE -->
<!-- MW_PARTS_APPS -->
<!-- MW_PARTS_STUDIO -->
</body>
</html>

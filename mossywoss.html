<head>

<style>

input,textarea{font-family:inherit}
.mw-hidden{display:none!important}

.mw-boot-hint{font-size:0.85em;color:var(--text2)}
.mw-pin-dots{display:flex;gap:12px;margin:8px 0}
.mw-pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--text2);transition:all .2s}
.mw-pin-dot.filled{background:var(--accent);border-color:var(--accent)}

.mw-taskbar-items{display:flex;gap:4px;flex:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}

.mw-taskbar-item{height:36px;padding:0 12px;border-radius:6px;background:rgba(255,255,255,0.05);border:1px solid transparent;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:0.82em;white-space:nowrap;transition:all .15s;max-width:180px}
.mw-taskbar-item:active,.mw-taskbar-item.active{background:rgba(255,140,0,0.2);border-color:var(--accent)}

.mw-taskbar-clock{font-size:0.8em;color:var(--text);padding:0 8px;cursor:pointer;white-space:nowrap}
.mw-start-menu{position:fixed;bottom:52px;left:12px;width:360px;max-width:calc(100vw - 24px);max-height:70vh;background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:9001;display:flex;flex-direction:column;overflow:hidden}
.mw-start-search{padding:12px;border-bottom:1px solid var(--border)}
.mw-start-search input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.9em;outline:none}
.mw-start-apps{overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mw-start-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:10px;cursor:pointer;transition:background .15s;text-align:center}
.mw-start-app:active{background:rgba(255,140,0,0.15)}
.mw-start-app svg{width:32px;height:32px}
.mw-start-app span{font-size:0.75em;color:var(--text)}
.mw-window{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:200px;min-height:120px}

.mw-win-titlebar{height:36px;background:var(--surface2);display:flex;align-items:center;padding:0 8px;gap:8px;cursor:grab;flex-shrink:0;border-bottom:1px solid var(--border)}

.mw-win-body{flex:1;overflow:auto;position:relative}
.mw-app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.mw-fm{display:flex;height:100%}
.mw-fm-sidebar{width:160px;border-right:1px solid var(--border);padding:8px 0;overflow-y:auto;flex-shrink:0}
.mw-fm-sidebar-item{padding:8px 12px;font-size:0.85em;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}

.mw-fm-toolbar button:active{background:rgba(255,140,0,0.2)}
.mw-fm-path{font-size:0.8em;color:var(--text2);padding:4px 8px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw-fm-list{flex:1;overflow-y:auto;padding:8px}
.mw-fm-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .15s}
.mw-fm-item:active{background:rgba(255,140,0,0.15)}
.mw-fm-item svg{width:20px;height:20px;flex-shrink:0}
.mw-fm-item span{font-size:0.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw-code{display:flex;flex-direction:column;height:100%}

.mw-code-area{flex:1;position:relative;overflow:hidden}
.mw-code-input{position:absolute;inset:0;width:100%;height:100%;border:none;background:transparent;color:transparent;font-family:monospace;font-size:13px;line-height:1.5;padding:8px;resize:none;outline:none;caret-color:var(--accent);white-space:pre;overflow:auto;user-select:text}

.mw-settings{padding:20px;overflow-y:auto;height:100%}

.mw-settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.mw-settings-row label{font-size:0.9em}
.mw-settings-row input[type="text"]{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.85em}
.mw-color-swatches{display:flex;gap:8px;flex-wrap:wrap}
.mw-color-swatch{width:32px;height:32px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.mw-color-swatch.selected{border-color:#fff;transform:scale(1.1)}
.mw-toggle{width:44px;height:24px;border-radius:12px;background:var(--border);cursor:pointer;position:relative;transition:background .2s}
.mw-toggle.on{background:var(--accent)}
.mw-toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.mw-toggle.on::after{transform:translateX(20px)}
.mw-diagnostics{padding:20px;overflow-y:auto;height:100%}
.mw-diag-item{padding:12px;border-radius:8px;margin-bottom:8px;background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:space-between}
.mw-diag-item span:first-child{font-size:0.88em}
.mw-diag-badge{padding:3px 10px;border-radius:12px;font-size:0.75em;font-weight:600}
.mw-diag-ok{background:rgba(76,175,80,0.2);color:#4caf50}

.mw-about{padding:20px;overflow-y:auto;height:100%;text-align:center}
.mw-about-logo{font-size:2em;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),#ffaa44);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mw-about-version{color:var(--text2);font-size:0.85em;margin-bottom:20px}
.mw-about-info{text-align:left;font-size:0.85em;line-height:1.8;color:var(--text)}
.mw-chatter{display:flex;flex-direction:column;height:100%}
.mw-chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.mw-chat-msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:0.88em;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.mw-chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.mw-chat-msg.ai{align-self:flex-start;background:var(--surface2)}
.mw-chat-msg.error{align-self:center;background:rgba(244,67,54,0.15);color:#f44336;font-size:0.82em;text-align:center}
.mw-chat-input{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.mw-chat-input textarea{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.88em;resize:none;outline:none;max-height:100px}
.mw-chat-input button{padding:0 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:0.85em}
.mw-chat-input button:active{background:var(--accent2)}
.mw-chat-input button:disabled{opacity:0.5}
.mw-browser{display:flex;flex-direction:column;height:100%}
.mw-browser-bar{padding:8px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--border);background:var(--surface2)}
.mw-browser-bar button{width:32px;height:32px;border-radius:6px;border:none;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mw-browser-bar button:active{background:rgba(255,255,255,0.1)}
.mw-browser-bar input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.85em;outline:none}
.mw-browser-frame{flex:1;border:none;background:#fff}
.mw-browser-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text2)}
.mw-osmaker{padding:20px;overflow-y:auto;height:100%}
.mw-osmaker-section{margin-bottom:20px}
.mw-osmaker-section h3{font-size:0.9em;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.mw-osmaker-input{width:100%;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.85em;margin-bottom:8px}
.mw-osmaker textarea{width:100%;min-height:120px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:0.8em;resize:vertical}

.mw-osmaker button:active{background:var(--accent2)}
.mw-osmaker-app{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:6px;background:rgba(255,255,255,0.03);margin-bottom:4px;font-size:0.85em}
.mw-osmaker-app button{padding:4px 8px;font-size:0.78em;background:rgba(244,67,54,0.2);color:#f44336;border:1px solid rgba(244,67,54,0.3)}
.mw-ctx-menu{position:fixed;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);z-index:9500;padding:4px;min-width:160px}

.mw-notification{position:fixed;top:20px;right:20px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:10px;padding:14px 20px;box-shadow:var(--shadow);z-index:9600;font-size:0.88em;animation:mw-slidein .3s ease}
@keyframes mw-slidein{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.mw-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9700;display:flex;align-items:center;justify-content:center}
.mw-modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:300px;max-width:90vw;box-shadow:var(--shadow)}

.mw-bootlogo{position:fixed;inset:0;background:linear-gradient(135deg,#0a0a12,#16162a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9997}
.mw-bootlogo-text{font-size:2.5em;font-weight:700;background:linear-gradient(135deg,#ff8c00,#ffaa44);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px}

<body>
<div id="mw-root"></div>
<script>
// ═══════════════════════════════════════════════════
// MW-VFS: IndexedDB Virtual Filesystem
// ═══════════════════════════════════════════════════
const VFS = {
  db: null,
  async init() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('MW-VFS', 1);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('fs')) {
          db.createObjectStore('fs', { keyPath: 'path' });
        }
      };
      r.onsuccess = e => { this.db = e.target.result; res(this); };
      r.onerror = e => rej(e.target.error);
    });
  },
  _tx(mode = 'readonly') { return this.db.transaction('fs', mode).objectStore('fs'); },
  async create(path, content = '', type = 'file') {
    const entry = { path, name: path.split('/').pop(), parent: path.split('/').slice(0,-1).join('/') || '/', type, content: type === 'dir' ? null : content, created: Date.now(), modified: Date.now(), size: type === 'dir' ? 0 : (content||'').length };
    return new Promise((res, rej) => {
      const tx = this.db.transaction('fs', 'readwrite');
      tx.objectStore('fs').put(entry);
      tx.oncomplete = () => res(entry);
      tx.onerror = () => rej(tx.error);
    });
  },
  async read(path) {
    return new Promise((res, rej) => {
      const r = this._tx().get(path);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => rej(r.error);
    });
  },
  async update(path, content) {
    const e = await this.read(path);
    if (!e) return null;
    const u = { ...e, content, modified: Date.now(), size: (content||'').length };
    return new Promise((res, rej) => {
      const tx = this.db.transaction('fs', 'readwrite');
      tx.objectStore('fs').put(u);
      tx.oncomplete = () => res(u);
      tx.onerror = () => rej(tx.error);
    });
  },
  async del(path) {
    const e = await this.read(path);
    if (!e) return;
    const paths = [path];
    if (e.type === 'dir') { const all = await this.list(path, true); all.forEach(a => paths.push(a.path)); }
    return new Promise((res, rej) => {
      const tx = this.db.transaction('fs', 'readwrite');
      paths.forEach(p => tx.objectStore('fs').delete(p));
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async list(dir, recursive = false) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction('fs', 'readonly');
      const req = tx.objectStore('fs').getAll();
      req.onsuccess = () => {
        const all = req.result;
        const items = recursive ? all.filter(r => r.path.startsWith(dir + '/')) : all.filter(r => r.parent === dir);
        res(items.sort((a,b) => { if (a.type !== b.type) return a.type === 'dir' ? -1 : 1; return a.name.localeCompare(b.name); }));
      };
      req.onerror = () => rej(req.error);
    });
  },
  async rename(oldPath, newName) {
    const e = await this.read(oldPath);
    if (!e) return null;
    const newPath = e.parent + '/' + newName;
    const u = { ...e, path: newPath, name: newName, modified: Date.now() };
    return new Promise((res, rej) => {
      const tx = this.db.transaction('fs', 'readwrite');
      tx.objectStore('fs').delete(oldPath);
      tx.objectStore('fs').put(u);
      tx.oncomplete = () => res(u);
      tx.onerror = () => rej(tx.error);
    });
  },
  async exists(path) { return (await this.read(path)) !== null; },
  async ensureDir(path) { if (!(await this.exists(path))) await this.create(path, '', 'dir'); },
  async search(q) {
    return new Promise((res) => {
      const r = this._tx().getAll();
      r.onsuccess = () => res(r.result.filter(e => e.type === 'file' && e.name.toLowerCase().includes(q.toLowerCase())));
    });
  },
  async exportAll() {
    return new Promise((res) => { const r = this._tx().getAll(); r.onsuccess = () => res(r.result); });
  }
};

// Syntax Highlighter
// ═══════════════════════════════════════════════════
let csLang = 'javascript';
function highlight(code, lang) {
  lang = lang || csLang || 'javascript';
  if (lang === 'html') return highlightHTML(code);
  if (lang === 'css') return highlightCSS(code);
  if (lang === 'json') return highlightJSON(code);
  return highlightCode(code, lang);
}
function highlightHTML(code) {
  let h = escHtml(code);
  h = h.replace(/(&lt;\/?[a-zA-Z][\w-]*)/g, '<span class="tk-tag">$1</span>');
  h = h.replace(/([a-zA-Z-]+)(=)("[^"]*")/g, '<span class="tk-attr">$1</span>$2<span class="tk-val">$3</span>');

}
function highlightCSS(code) {
  let h = escHtml(code);

  h = h.replace(/^([.#]?[a-zA-Z][\w-]*(?:[,\s>+~][.#]?[a-zA-Z][\w-]*)*)\s*\{/gm, '<span class="tk-tag">$1</span> {');

}
function highlightJSON(code) {

  h = h.replace(/:\s*("[^"]*")/g, ': <span class="tk-s">$1</span>');

}
function highlightCode(code, lang) {
  const cppKW = /\b(function|const|let|var|if|else|for|while|return|class|import|export|from|default|new|this|async|await|try|catch|finally|throw|typeof|instanceof|void|delete|yield|static|public|private|protected|readonly|def|print|elif|lambda|None|True|False|self|int|float|str|bool|list|dict|set|include|define|struct|typedef|unsigned|char|short|long|double|float|void|NULL|nullptr|enum|namespace|interface|type|extends|implements|abstract|final|do|switch|case|break|continue|in|of|with|as|pass|raise|except|global|nonlocal|assert|del|is|not|or|and|auto|register|volatile|goto|union|extern|template|typename|virtual|override|friend|operator|inline|using|mutable|explicit|constexpr|wchar_t|size_t|static_cast|dynamic_cast|reinterpret_cast|const_cast|noexcept|decltype|alignof|alignas|thread_local|co_await|co_return|co_yield|requires|concept|module|import|export|char16_t|char32_t|char8_t|signed|bool|get|put|printf|scanf|malloc|free|calloc|realloc|memcpy|memset|strlen|strcmp|strcpy|strcat|fopen|fclose|fread|fwrite|fgets|fputs|main|argc|argv|std|cout|cin|endl|vector|string|map|set|unordered_map|unordered_set|array|list|queue|stack|pair|make_pair|push_back|pop_back|size|begin|end|find|insert|erase|clear|empty|front|back|at|reserve|resize|data|c_str|to_string|stoi|stol|stof|stod|sort|reverse|unique|swap|min|max|abs|pow|sqrt|sin|cos|tan|log|exp|floor|ceil|round|rand|srand|time|clock|exit|abort|system|printf|fprintf|sprintf|snprintf|sscanf|fscanf|sizeof|typedef)\b/g;
  const tokens = [];
  let pos = 0;
  const patterns = [
    [/^\/\/[^\n]*/, 'c'], [/^\/\*[\s\S]*?\*\//, 'c'], [/^#[^\n]*/, 'c'],
    [/^"(?:[^"\\]|\\.)*"/, 's'], [/^'(?:[^'\\]|\\.)*'/, 's'], [/^`(?:[^`\\]|\\.)*`/, 's'],
    [/^\d+\.?[\d]*[fFuUlL]*/, 'n'], [cppKW, 'k'],
    [/^[a-zA-Z_]\w*(?=\s*\()/, 'f'],
    [/^#\w+/, 'k'],
    [/^\s+/, ''], [/^./, ''],
  ];
  while (pos < code.length) {
    const rest = code.slice(pos);
    let matched = false;
    for (const [re, type] of patterns) {
      const m = re.exec(rest);
      if (m && m[0]) {
        if (type) tokens.push({ t: type, v: m[0] });

      }
    }

}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openApp(appId) {
  const app = APPS.find(a => a.id === appId);
  if (!app) return;
  state.windows.push({ id: appId + '_' + Date.now(), appId, title: app.name, icon: app.icon, x: 60 + (state.windows.length % 5) * 30, y: 60 + (state.windows.length % 5) * 30, w: app.w, h: app.h, z: ++state.zCounter, min: false, max: false, prev: null });

  state.activeWin = state.windows[state.windows.length - 1].id;
  render();
}
function closeWin(id) { state.windows = state.windows.filter(w => w.id !== id); state.activeWin = null; render(); }
function minWin(id) { state.windows = state.windows.map(w => w.id === id ? { ...w, min: true } : w); render(); }
function maxWin(id) {
  state.windows = state.windows.map(w => {
    if (w.id !== id) return w;
    if (w.max) return { ...w, max: false, x: w.prev.x, y: w.prev.y, w: w.prev.w, h: w.prev.h };
    return { ...w, max: true, prev: { x: w.x, y: w.y, w: w.w, h: w.h } };
  });
  render();
}
function focusWin(id) { state.windows = state.windows.map(w => w.id === id ? { ...w, z: ++state.zCounter, min: false } : w); state.activeWin = id; render(); }
function startDrag(id, e) {
  const win = state.windows.find(w => w.id === id);
  if (!win || win.max) return;
  const px = e.touches ? e.touches[0].clientX : e.clientX;
  const py = e.touches ? e.touches[0].clientY : e.clientY;
  const ox = win.x, oy = win.y;
  const move = ev => {
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    win.x = Math.max(0, Math.min(window.innerWidth - 50, ox + cx - px));
    win.y = Math.max(0, Math.min(window.innerHeight - 80, oy + cy - py));
    updateWinPos(id, win.x, win.y);
  };
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up); };
  document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  document.addEventListener('touchmove', move, { passive: false }); document.addEventListener('touchend', up);
}
function startResize(id, e) {
  const win = state.windows.find(w => w.id === id);
  if (!win || win.max) return;
  e.stopPropagation();
  const px = e.touches ? e.touches[0].clientX : e.clientX;
  const py = e.touches ? e.touches[0].clientY : e.clientY;
  const ow = win.w, oh = win.h;
  const move = ev => {
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    win.w = Math.max(200, ow + cx - px);
    win.h = Math.max(120, oh + cy - py);
    updateWinSize(id, win.w, win.h);
  };
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up); };

const fmState = {};
function renderFileManager(winId) {

  });
  html += '</div><div class="mw-fm-main"><div class="mw-fm-toolbar">';
  html += `<button onclick="fmNew('${winId}','file')">${Ico.newfile}New File</button>`;
  html += `<button onclick="fmNew('${winId}','dir')">${Ico.newfolder}New Folder</button>`;
  html += `<div class="mw-fm-path">${s.path}</div>`;

}
async function fmRefresh(winId) {
  const s = fmState[winId]; if (!s) return;
  const el = document.getElementById('fm-list-' + winId); if (!el) return;
  const items = await VFS.list(s.path);
  if (items.length === 0) { el.innerHTML = '<div style="padding:20px;color:var(--text2);font-size:0.85em">Empty folder</div>'; return; }
  el.innerHTML = items.map(it => {
    const icon = it.type === 'dir' ? Ico.folder : Ico.file;
    const click = it.type === 'dir' ? `fmNav('${winId}','${it.path}')` : `fmOpenFile('${winId}','${it.path}')`;
    return `<div class="mw-fm-item" onclick="${click}">${icon}<span>${it.name}</span></div>`;

function fmNew(winId, type) {
  const name = type === 'dir' ? 'New Folder' : 'New File.txt';

async function fmOpenFile(winId, path) {
  const file = await VFS.read(path);

    const input = document.getElementById('code-input-' + codeWin.id);

      const langSel = document.getElementById('code-lang-' + codeWin.id);

function csInput(winId, ta) {
  const display = document.getElementById('code-display-' + winId);
  const lines = document.getElementById('code-lines-' + winId);
  const lang = csState[winId]?.lang || 'javascript';
  display.innerHTML = highlight(ta.value, lang);

function csScroll(winId, ta) {
  const display = document.getElementById('code-display-' + winId);
  display.scrollTop = ta.scrollTop; display.scrollLeft = ta.scrollLeft;
}
function updateLineNumbers(ta, el) {
  const n = ta.value.split('\n').length;
  el.textContent = Array.from({length: n}, (_, i) => i + 1).join('\n');
}
function csSetLang(winId, lang) { if (csState[winId]) { csState[winId].lang = lang; csLang = lang; const input = document.getElementById('code-input-' + winId); if (input) csInput(winId, input); } }
function csNew(winId) {
  const input = document.getElementById('code-input-' + winId);
  if (input) { input.value = ''; csInput(winId, input); csState[winId].path = null; }
}
function csSave(winId) {
  const input = document.getElementById('code-input-' + winId);
  if (!input) return;
  if (!csState[winId].path) {
    showInputModal('Save File', 'Enter file path (e.g. /Documents/code.js):', '/Documents/untitled.js', (path) => {
      csState[winId].path = path;
      VFS.create(path, input.value, 'file').then(() => notify('File saved to ' + path));
    });
  } else {
    VFS.update(csState[winId].path, input.value).then(() => notify('Saved ' + csState[winId].path));
  }
}
function csOpen(winId) {
  VFS.list('/').then(items => {
    const files = items.filter(i => i.type === 'file').map(i => `<div class="mw-fm-item" onclick="csDoOpen('${winId}','${i.path}')">${Ico.file}<span>${i.path}</span></div>`).join('');
    showCustomModal('Open File', `<div style="max-height:300px;overflow:auto">${files || '<div style="color:var(--text2);padding:12px">No files found</div>'}</div>`);
  });
}
async function csDoOpen(winId, path) {
  const file = await VFS.read(path);
  if (!file) return;
  csState[winId] = { path, lang: 'javascript' };
  const input = document.getElementById('code-input-' + winId);
  if (input) { input.value = file.content || ''; csInput(winId, input); }
  closeModal();
  notify('Opened ' + path);
}
function csPreview(winId) {
  const input = document.getElementById('code-input-' + winId);
  if (!input) return;
  const lang = csState[winId]?.lang || 'javascript';
  if (lang === 'html') {
    const blob = new Blob([input.value], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  } else {
    notify('Preview available for HTML files');
  }
}

// Diagnostics
function renderDiagnostics() {
  const tests = [
    { name: 'IndexedDB', check: () => !!window.indexedDB },
    { name: 'Service Worker', check: () => 'serviceWorker' in navigator },
    { name: 'WebGL', check: () => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); } catch(e) { return false; } } },
    { name: 'WebGPU', check: () => !!navigator.gpu },
    { name: 'WebXR', check: () => !!navigator.xr },
    { name: 'Gamepad API', check: () => !!navigator.getGamepads },
    { name: 'Touch Events', check: () => 'ontouchstart' in window },
    { name: 'Pointer Events', check: () => !!window.PointerEvent },
    { name: 'Geolocation', check: () => !!navigator.geolocation },
    { name: 'MediaRecorder', check: () => !!window.MediaRecorder },
    { name: 'AudioContext', check: () => !!window.AudioContext || !!window.webkitAudioContext },
    { name: 'Clipboard API', check: () => !!navigator.clipboard },
    { name: 'Vibration', check: () => !!navigator.vibrate },
    { name: 'File API', check: () => !!window.File && !!window.FileReader },
    { name: 'Battery API', check: () => !!navigator.getBattery },
  ];
  let html = '<div class="mw-diagnostics">';
  tests.forEach(t => {
    let result, cls;
    try { result = t.check(); cls = result ? 'ok' : 'no'; result = result ? 'SUPPORTED' : 'NOT SUPPORTED'; }
    catch(e) { result = 'ERROR'; cls = 'no'; }
    html += `<div class="mw-diag-item"><span>${t.name}</span><span class="mw-diag-badge mw-diag-${cls}">${result}</span></div>`;
  });
  html += '</div>';
  return html;
}

const chatState = {};
function renderChatter(winId) {
  chatState[winId] = { messages: [], input: '', loading: false };
  return `<div class="mw-chatter">
    <div class="mw-chat-messages" id="chat-msgs-${winId}"><div class="mw-chat-msg error">AI Service: Check if GEMINI_API_KEY is configured. Messages will show AI_SERVICE_UNAVAILABLE if not set.</div></div>
    <div class="mw-chat-input">
      <textarea id="chat-input-${winId}" placeholder="Ask anything..." rows="1" oninput="chatState['${winId}'].input=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend('${winId}')}""></textarea>
      <button id="chat-send-${winId}" onclick="chatSend('${winId}')">Send</button>
    </div>
  </div>`;
}
async function chatSend(winId) {
  const s = chatState[winId]; if (!s || s.loading) return;
  const text = s.input.trim(); if (!text) return;
  s.input = '';
  document.getElementById('chat-input-' + winId).value = '';
  s.messages.push({ role: 'user', content: text });
  s.loading = true;
  updateChatMsgs(winId);
  try {
    const res = await fetch('/api/functions/mwAIChat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: s.messages.map(m => ({ role: m.role, content: m.content })), systemPrompt: 'You are Chatter, a helpful AI assistant for the MossyWoss OS. You help with coding, debugging, research, planning, and general questions. Be concise and helpful.' })
    });
    const data = await res.json();
    if (data.error) {
      s.messages.push({ role: 'ai', content: 'AI SERVICE UNAVAILABLE: ' + (data.message || data.error) });
    } else {
      s.messages.push({ role: 'assistant', content: data.text });
    }
  } catch(e) {
    s.messages.push({ role: 'ai', content: 'Error: ' + e.message });
  }
  s.loading = false;
  updateChatMsgs(winId);
}
function updateChatMsgs(winId) {
  const el = document.getElementById('chat-msgs-' + winId); if (!el) return;
  const s = chatState[winId];
  el.innerHTML = s.messages.map(m => `<div class="mw-chat-msg ${m.role === 'user' ? 'user' : m.role === 'assistant' ? 'ai' : 'error'}">${escHtml(m.content)}</div>`).join('');
  if (s.loading) el.innerHTML += '<div class="mw-chat-msg ai">Thinking...</div>';
  el.scrollTop = el.scrollHeight;
}

const browserState = {};
function renderBrowser(winId) {
  browserState[winId] = { url: '', history: [], idx: -1 };
  return `<div class="mw-browser">
    <div class="mw-browser-bar">
      <button onclick="browserBack('${winId}')">${Ico.back}</button>
      <button onclick="browserFwd('${winId}')">${Ico.fwd}</button>
      <button onclick="browserReload('${winId}')">${Ico.reload}</button>
      <input id="browser-url-${winId}" placeholder="Enter URL or search..." value="" onkeydown="if(event.key==='Enter')browserGo('${winId}',this.value)">
    </div>
    <div id="browser-content-${winId}" class="mw-browser-empty">${Ico.globe}<div style="font-size:0.9em">Enter a URL to browse</div><div style="font-size:0.8em">Note: Many sites block iframe embedding</div></div>
  </div>`;
}
function browserGo(winId, url) {
  if (!url) return;
  if (!url.startsWith('http')) url = 'https://' + url;
  const s = browserState[winId];
  s.url = url;
  s.history = s.history.slice(0, s.idx + 1).concat([url]);
  s.idx = s.history.length - 1;
  const el = document.getElementById('browser-content-' + winId);
  el.className = '';
  el.innerHTML = `<iframe class="mw-browser-frame" src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;
}
function browserBack(winId) {
  const s = browserState[winId]; if (s.idx > 0) { s.idx--; browserLoad(winId); }
}
function browserFwd(winId) {
  const s = browserState[winId]; if (s.idx < s.history.length - 1) { s.idx++; browserLoad(winId); }
}
function browserReload(winId) { browserLoad(winId); }
function browserLoad(winId) {
  const s = browserState[winId]; if (!s || s.idx < 0) return;
  const url = s.history[s.idx];
  s.url = url;
  const input = document.getElementById('browser-url-' + winId); if (input) input.value = url;
  const el = document.getElementById('browser-content-' + winId);
  el.className = '';
  el.innerHTML = `<iframe class="mw-browser-frame" src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;
}

// 2D Game Studio
const gsState = {};
function renderGame2D(winId) {
  gsState[winId] = { sprites: [], playing: false, selected: null, canvas: null, ctx: null, loop: null, keys: {} };
  return `<div class="mw-app" style="padding:12px">
    <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap">
      <button onclick="gsAddSprite('${winId}')" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(255,140,0,0.2);color:var(--text);cursor:pointer;font-size:0.82em">Add Sprite</button>
      <button onclick="gsPlay('${winId}')" id="gs-play-${winId}" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(76,175,80,0.2);color:#4caf50;cursor:pointer;font-size:0.82em">Play</button>
      <button onclick="gsStop('${winId}')" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(244,67,54,0.2);color:#f44336;cursor:pointer;font-size:0.82em">Stop</button>
      <button onclick="gsSave('${winId}')" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text);cursor:pointer;font-size:0.82em">Save</button>
      <span style="font-size:0.8em;color:var(--text2);margin-left:auto">Arrow keys to move selected sprite</span>
    </div>
    <canvas id="gs-canvas-${winId}" width="560" height="380" style="border:1px solid var(--border);border-radius:8px;background:#111;display:block;touch-action:none"></canvas>
  </div>`;
}
function gsInit(winId) {
  const canvas = document.getElementById('gs-canvas-' + winId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  gsState[winId].canvas = canvas;
  gsState[winId].ctx = ctx;
  gsDraw(winId);
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const s = gsState[winId];
    s.selected = s.sprites.findIndex(sp => x >= sp.x && x <= sp.x+sp.w && y >= sp.y && y <= sp.y+sp.h);
    gsDraw(winId);
  });
}
function gsAddSprite(winId) {
  const colors = ['#ff8c00','#4caf50','#2196f3','#e91e63','#9c27b0'];
  gsState[winId].sprites.push({ x: 50+Math.random()*400, y: 50+Math.random()*200, w: 40, h: 40, vx: 0, vy: 0, color: colors[gsState[winId].sprites.length % colors.length] });
  gsDraw(winId);
}
function gsDraw(winId) {
  const s = gsState[winId]; if (!s.ctx) return;
  s.ctx.fillStyle = '#111';
  s.ctx.fillRect(0, 0, s.canvas.width, s.canvas.height);
  s.sprites.forEach((sp, i) => {
    s.ctx.fillStyle = sp.color;
    s.ctx.fillRect(sp.x, sp.y, sp.w, sp.h);
    if (i === s.selected) {
      s.ctx.strokeStyle = '#fff'; s.ctx.lineWidth = 2;
      s.ctx.strokeRect(sp.x - 2, sp.y - 2, sp.w + 4, sp.h + 4);
    }
  });
  if (s.sprites.length === 0) {
    s.ctx.fillStyle = '#555'; s.ctx.font = '14px sans-serif';
    s.ctx.fillText('Click "Add Sprite" to begin', 180, 190);
  }
}
function gsPlay(winId) {
  const s = gsState[winId]; if (s.playing) return;
  s.playing = true;
  const keys = {};
  const kd = e => { keys[e.key] = true; };
  const ku = e => { keys[e.key] = false; };
  document.addEventListener('keydown', kd); document.addEventListener('keyup', ku);
  s.loop = setInterval(() => {
    s.sprites.forEach((sp, i) => {
      if (i === s.selected) {
        if (keys['ArrowLeft']) sp.x = Math.max(0, sp.x - 3);
        if (keys['ArrowRight']) sp.x = Math.min(s.canvas.width - sp.w, sp.x + 3);
        if (keys['ArrowUp']) sp.y = Math.max(0, sp.y - 3);
        if (keys['ArrowDown']) sp.y = Math.min(s.canvas.height - sp.h, sp.y + 3);
      }
    });
    gsDraw(winId);
  }, 1000/30);
}
function gsStop(winId) {
  const s = gsState[winId]; if (!s.playing) return;
  s.playing = false;
  clearInterval(s.loop);
}
async function gsSave(winId) {
  const s = gsState[winId];
  const path = '/Projects/game2d.json';
  await VFS.create(path, JSON.stringify({ sprites: s.sprites }), 'file');
  notify('Game saved to ' + path);
}

}

// Boot Sequence (BIOS POST → Boot Logo → Lock Screen)
// ═══════════════════════════════════════════════════
let bootStage = 'bios';
let bootProgress = 0;

function startBootSequence() {
  bootStage = 'bios';
  bootProgress = 0;
  render();
  
  // Simulate BIOS POST with real capability detection
  const checks = [
    { label: 'CPU', value: navigator.hardwareConcurrency ? navigator.hardwareConcurrency + ' cores' : 'Unknown' },
    { label: 'Memory', value: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unknown' },
    { label: 'Storage', value: 'IndexedDB ' + (window.indexedDB ? 'OK' : 'FAIL') },
    { label: 'Display', value: window.screen.width + 'x' + window.screen.height },
    { label: 'GPU', value: 'WebGL ' + (() => { try { const c = document.createElement('canvas'); return (c.getContext('webgl') || c.getContext('experimental-webgl')) ? 'OK' : 'FAIL'; } catch(e) { return 'FAIL'; } })() },
    { label: 'WebRTC', value: typeof RTCPeerConnection !== 'undefined' ? 'OK' : 'NOT AVAILABLE' },
    { label: 'Touch', value: 'ontouchstart' in window ? 'OK' : 'NOT AVAILABLE' },
    { label: 'Network', value: navigator.onLine ? 'ONLINE' : 'OFFLINE' },
  ];
  
  let checkIdx = 0;
  const checkInterval = setInterval(() => {
    if (checkIdx < checks.length) {
      bootProgress = Math.round(((checkIdx + 1) / checks.length) * 100);
      render();
      checkIdx++;
    } else {
      clearInterval(checkInterval);
      // Move to boot logo stage
      bootStage = 'logo';
      render();
      setTimeout(() => {
        bootStage = 'lock';
        render();
      }, 1500);
    }
  }, 300);
}

function renderBios() {
  const checks = [
    { label: 'CPU', value: navigator.hardwareConcurrency ? navigator.hardwareConcurrency + ' cores' : 'Unknown' },
    { label: 'Memory', value: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unknown' },
    { label: 'Storage', value: 'IndexedDB ' + (window.indexedDB ? 'OK' : 'FAIL') },
    { label: 'Display', value: window.screen.width + 'x' + window.screen.height },
    { label: 'GPU', value: 'WebGL ' + (() => { try { const c = document.createElement('canvas'); return (c.getContext('webgl') || c.getContext('experimental-webgl')) ? 'OK' : 'FAIL'; } catch(e) { return 'FAIL'; } })() },
    { label: 'WebRTC', value: typeof RTCPeerConnection !== 'undefined' ? 'OK' : 'NOT AVAILABLE' },
    { label: 'Touch', value: 'ontouchstart' in window ? 'OK' : 'NOT AVAILABLE' },
    { label: 'Network', value: navigator.onLine ? 'ONLINE' : 'OFFLINE' },
  ];
  
  const barWidth = Math.round(bootProgress * 2);
  let text = 'MWO BIOS v1.0                    (C) 2026 MossyWoss Systems\n\n';
  text += 'Initializing system...\n\n';
  
  checks.forEach((c, i) => {
    if (i < Math.ceil(checks.length * bootProgress / 100)) {
      text += c.label.padEnd(12) + ': ' + c.value + '\n';
    }
  });
  
  text += '\nBoot Progress: [' + '█'.repeat(Math.floor(bootProgress / 5)) + '░'.repeat(20 - Math.floor(bootProgress / 5)) + '] ' + bootProgress + '%\n';
  
  if (bootProgress >= 100) {
    text += '\nBooting MossyWoss OS...';
  }
  
  return '<div class="mw-bios">' + text + '</div>';
}

function renderBootLogo() {
  return '<div class="mw-bootlogo"><div class="mw-bootlogo-text">MossyWoss OS</div><div class="mw-bootlogo-spin"></div><div style="margin-top:20px;color:var(--text2);font-size:0.85em">Loading desktop environment...</div></div>';
}

// ═══════════════════════════════════════════════════
// Multiplayer (PeerJS - Free P2P)
// ═══════════════════════════════════════════════════
const mpState = {};
function renderMultiplayer(winId) {
  mpState[winId] = mpState[winId] || { peer: null, myId: '', status: 'disconnected', connections: [], messages: [], input: '' };
  const s = mpState[winId];
  let statusClass = s.status === 'connected' ? 'connected' : s.status === 'connecting' ? 'connecting' : 'disconnected';
  let statusText = s.status === 'connected' ? 'CONNECTED — ' + s.connections.length + ' peer(s)' : s.status === 'connecting' ? 'CONNECTING...' : 'DISCONNECTED';
  
  let html = '<div class="mw-mp">';
  html += '<div class="mw-mp-status ' + statusClass + '">' + statusText + '</div>';
  
  if (s.myId) {
    html += '<div class="mw-mp-section"><h4>Your Peer ID</h4><input type="text" value="' + s.myId + '" readonly onclick="this.select()"><div style="font-size:0.78em;color:var(--text2);margin-top:4px">Share this ID with others to let them connect</div></div>';
  }
  
  html += '<div class="mw-mp-section"><h4>Host Session</h4><button onclick="mpHost(\''+winId+'\')">Start Hosting</button><span style="font-size:0.8em;color:var(--text2);margin-left:8px">Creates a peer ID for others to join</span></div>';
  
  html += '<div class="mw-mp-section"><h4>Join Session</h4><input type="text" id="mp-join-'+winId+'" placeholder="Enter peer ID..."><button onclick="mpJoin(\''+winId+'\')">Connect</button></div>';
  
  if (s.connections.length > 0) {
    html += '<div class="mw-mp-chat"><div class="mw-mp-chat-msgs" id="mp-chat-'+winId+'">';
    s.messages.forEach(m => {
      html += '<div class="mw-mp-chat-msg ' + (m.me ? 'me' : 'them') + '">' + escHtml(m.text) + '</div>';
    });
    html += '</div><div class="mw-mp-chat-input"><input type="text" id="mp-input-'+winId+'" placeholder="Type message..." onkeydown="if(event.key===\'Enter\')mpSend(\''+winId+'\')"><button onclick="mpSend(\''+winId+'\')">Send</button></div></div>';
  }
  
  html += '<div style="font-size:0.78em;color:var(--text2);text-align:center;margin-top:8px">PeerJS uses free WebRTC P2P — no server costs, no paid features</div>';
  html += '</div>';
  return html;
}

function mpHost(winId) {
  const s = mpState[winId]; if (!s) return;
  if (typeof Peer === 'undefined') { notify('PeerJS not loaded yet — try again in a moment'); return; }
  if (s.peer) { s.peer.destroy(); }
  s.status = 'connecting'; render();
  s.peer = new Peer();
  s.peer.on('open', (id) => {
    s.myId = id;
    s.status = 'connected';
    s.connections = [];
    render();
    notify('Hosting as ' + id);
  });
  s.peer.on('connection', (conn) => {
    conn.on('open', () => {
      s.connections.push(conn);
      s.messages.push({ me: false, text: 'Peer connected' });
      render();
    });
    conn.on('data', (data) => {
      if (data.type === 'chat') {
        s.messages.push({ me: false, text: data.text });
        render();
      } else if (data.type === 'file') {
        s.messages.push({ me: false, text: 'Received file: ' + data.name + ' (' + data.size + ' bytes)' });
        VFS.create('/Downloads/' + data.name, data.content, 'file').then(() => render());
        notify('Received file: ' + data.name);
      }
    });
    conn.on('close', () => {
      s.connections = s.connections.filter(c => c !== conn);
      s.messages.push({ me: false, text: 'Peer disconnected' });
      if (s.connections.length === 0) s.status = 'connected';
      render();
    });
  });
  s.peer.on('error', (err) => {
    s.status = 'disconnected';
    notify('PeerJS error: ' + err.type);
    render();
  });
}

function mpJoin(winId) {
  const s = mpState[winId]; if (!s) return;
  const input = document.getElementById('mp-join-' + winId);
  const peerId = input?.value?.trim();
  if (!peerId) { notify('Enter a peer ID'); return; }
  if (typeof Peer === 'undefined') { notify('PeerJS not loaded'); return; }
  if (s.peer) s.peer.destroy();
  s.status = 'connecting'; render();
  s.peer = new Peer();
  s.peer.on('open', () => {
    s.myId = s.peer.id;
    const conn = s.peer.connect(peerId, { reliable: true });
    conn.on('open', () => {
      s.status = 'connected';
      s.connections = [conn];
      s.messages = [{ me: false, text: 'Connected to ' + peerId }];
      render();
      notify('Connected to peer');
    });
    conn.on('data', (data) => {
      if (data.type === 'chat') {
        s.messages.push({ me: false, text: data.text });
        render();
      } else if (data.type === 'file') {
        s.messages.push({ me: false, text: 'Received file: ' + data.name });
        VFS.create('/Downloads/' + data.name, data.content, 'file').then(() => render());
        notify('Received: ' + data.name);
      }
    });
    conn.on('close', () => {
      s.connections = [];
      s.status = 'disconnected';
      s.messages.push({ me: false, text: 'Disconnected' });
      render();
    });
  });
  s.peer.on('error', (err) => {
    s.status = 'disconnected';
    notify('Connection failed: ' + err.type);
    render();
  });
}

function mpSend(winId) {
  const s = mpState[winId]; if (!s || s.connections.length === 0) return;
  const input = document.getElementById('mp-input-' + winId);
  const text = input?.value?.trim();
  if (!text) return;
  input.value = '';
  s.messages.push({ me: true, text });
  s.connections.forEach(conn => conn.send({ type: 'chat', text }));
  render();
}


// ═══════════════════════════════════════════════════
// Boot Screen
// ═══════════════════════════════════════════════════
function renderBoot() {
  const now = new Date();
  const time = now.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
  const date = now.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
  const hasPin = state.pin.length === 4;
  const pinDots = Array(4).fill(0).map((_, i) => `<div class="mw-pin-dot ${state.pinInput && state.pinInput.length > i ? 'filled' : ''}"></div>`).join('');
  
  return `<div class="mw-boot">
    <div class="mw-boot-clock">${time}</div>
    <div class="mw-boot-date">${date}</div>
    <div class="mw-boot-card">
      <div class="mw-boot-icon">${Ico.lock.replace('currentColor', '#f1c40f')}</div>
      <div class="mw-boot-name">${state.settings.username || 'Socks'}</div>
      <div class="mw-boot-hint">${hasPin ? 'Enter your PIN' : 'Set a 4-digit PIN'}</div>
      <div class="mw-pin-dots" id="pin-dots">${pinDots}</div>
      <div class="mw-numpad" id="numpad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="pinPress('${n}')">${n}</button>`).join('')}
        <div></div>
        <button onclick="pinPress('0')">0</button>
        <button onclick="pinBack()">${Ico.back}</button>
      </div>
    </div>
    <div class="mw-boot-footer">MossyWoss OS v1.0 — Browser-Based OS Environment</div>
  </div>`;
}
function pinPress(d) {
  if (!state.pinInput) state.pinInput = '';
  if (state.pinInput.length >= 4) return;
  state.pinInput += d;
  document.getElementById('pin-dots').innerHTML = Array(4).fill(0).map((_, i) => `<div class="mw-pin-dot ${state.pinInput.length > i ? 'filled' : ''}"></div>`).join('');
  if (state.pinInput.length === 4) {
    if (!state.pin) {
      state.pin = state.pinInput; localStorage.setItem('mw_pin', state.pin);
      notify('PIN set'); setTimeout(boot, 500);
    } else if (state.pinInput === state.pin) {
      setTimeout(boot, 200);
    } else {
      document.getElementById('pin-dots').innerHTML = Array(4).fill(0).map(() => `<div class="mw-pin-dot" style="border-color:#f44336"></div>`).join('');
      setTimeout(() => { state.pinInput = ''; render(); }, 500);
    }
  }
}
function pinBack() { if (state.pinInput) state.pinInput = state.pinInput.slice(0, -1); render(); }
async function boot() {
  state.booted = true; state.pinInput = '';
  // Initialize VFS and create default directories
  await VFS.init();
  state.vfsReady = true;
  const dirs = ['/Desktop','/Documents','/Downloads','/Pictures','/Projects','/Apps','/Trash','/Settings'];
  for (const d of dirs) { await VFS.ensureDir(d); }
  // Create a welcome file
  if (!(await VFS.exists('/Documents/welcome.txt'))) {
    await VFS.create('/Documents/welcome.txt', 'Welcome to MossyWoss OS!\n\nThis is a real browser-based OS environment with:\n- IndexedDB Virtual Filesystem (MW-VFS)\n- Real window manager\n- Code editor with syntax highlighting\n- File manager\n- Settings\n- Diagnostics\n- 2D Game Studio\n- OS Maker\n- Browser\n- AI Chat (Chatter)\n\nAll files are stored locally in your browser.\nDO NOT store real passwords here.', 'file');
  }
  render();
}

// ═══════════════════════════════════════════════════
// Desktop
// ═══════════════════════════════════════════════════
function getWallpaper() {
  const w = state.settings.wallpaper || 'gradient1';
  const wallpapers = {
    gradient1: 'linear-gradient(135deg,#0e0e1a,#1a1a2e)',
    gradient2: 'linear-gradient(135deg,#1a0a2e,#2e1a4e)',
    gradient3: 'linear-gradient(135deg,#0a1e2e,#0e2e4e)',
    solid1: '#000000',
  };
  return wallpapers[w] || wallpapers.gradient1;
}
function renderDesktop() {
  let html = `<div class="mw-desktop"><div class="mw-wallpaper" style="background:${getWallpaper()}"></div>`;
  // Desktop icons
  html += '<div class="mw-desktop-icons">';
  APPS.forEach(app => {
    html += `<div class="mw-desktop-icon" onclick="openApp('${app.id}')">${Ico[app.icon] || Ico.file}<span>${app.name}</span></div>`;
  });
  html += '</div>';
  // Windows
  state.windows.forEach(w => {
    if (w.min) return;
    html += `<div class="mw-window ${w.max ? 'maximized' : ''}" data-win="${w.id}" style="left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px;z-index:${w.z}">`;
    html += `<div class="mw-win-titlebar" onmousedown="startDrag('${w.id}',event)" ontouchstart="startDrag('${w.id}',event)" ondblclick="maxWin('${w.id}')">`;
    html += `<div class="mw-win-icon">${Ico[w.icon] || Ico.file}</div>`;
    html += `<div class="mw-win-title">${w.title}</div>`;
    html += `<div class="mw-win-btns"><button class="mw-win-btn" onclick="minWin('${w.id}')">${Ico.minus}</button><button class="mw-win-btn" onclick="maxWin('${w.id}')">${Ico.max}</button><button class="mw-win-btn close" onclick="closeWin('${w.id}')">${Ico.x}</button></div>`;
    html += '</div>';
    html += '<div class="mw-win-body">';
    html += renderAppBody(w.id, w.appId);
    html += '</div>';
    if (!w.max) html += `<div style="position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;background:transparent" onmousedown="startResize('${w.id}',event)" ontouchstart="startResize('${w.id}',event)"></div>`;
    html += '</div>';
  });
  html += '</div>';
  // Taskbar
  html += '<div class="mw-taskbar">';
  html += `<button class="mw-start-btn" onclick="toggleStart()">${Ico.home}</button>`;
  html += '<div class="mw-taskbar-items">';
  state.windows.forEach(w => {
    html += `<div class="mw-taskbar-item ${state.activeWin === w.id ? 'active' : ''}" onclick="${w.min ? 'focusWin' : 'focusWin'}('${w.id}')">${Ico[w.icon] || Ico.file}<span>${w.title}</span></div>`;
  });
  html += '</div>';
  const now = new Date();
  html += `<div class="mw-taskbar-clock">${now.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})} ${now.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</div>`;
  html += '</div>';
  // Start menu
  if (state.startOpen) {
    html += '<div class="mw-start-menu" onclick="event.stopPropagation()">';
    html += '<div class="mw-start-search"><input placeholder="Search apps..." oninput="startSearch(this.value)" id="start-search-input"></div>';
    html += '<div class="mw-start-apps" id="start-apps">';
    APPS.forEach(app => {
      html += `<div class="mw-start-app" onclick="openApp('${app.id}')">${Ico[app.icon] || Ico.file}<span>${app.name}</span></div>`;
    });
    html += '</div></div>';
    html += '<div style="position:fixed;inset:0;z-index:8999" onclick="state.startOpen=false;render()"></div>';
  }
  // Notifications
  state.notifications.forEach(n => {
    html += `<div class="mw-notification">${n.msg}</div>`;
  });
  // Modal
  if (state.modal) {
    if (state.modal.type === 'input') {
      html += `<div class="mw-modal-overlay" onclick="closeModal()"><div class="mw-modal" onclick="event.stopPropagation()"><h3>${state.modal.title}</h3><p style="color:var(--text2);font-size:0.85em;margin-bottom:12px">${state.modal.hint}</p><input id="modal-input" value="${state.modal.defVal||''}" onkeydown="if(event.key==='Enter'){state.modal.callback(this.value);closeModal()}"><div class="mw-modal-btns"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="document.getElementById('modal-input').value&&state.modal.callback(document.getElementById('modal-input').value);closeModal()">OK</button></div></div></div>`;
    } else if (state.modal.type === 'custom') {
      html += `<div class="mw-modal-overlay" onclick="closeModal()"><div class="mw-modal" onclick="event.stopPropagation()"><h3>${state.modal.title}</h3>${state.modal.content}<div class="mw-modal-btns"><button class="primary" onclick="closeModal()">Close</button></div></div></div>`;
    }
  }
  return html;
}
function toggleStart() { state.startOpen = !state.startOpen; render(); if (state.startOpen) setTimeout(() => { const i = document.getElementById('start-search-input'); if (i) i.focus(); }, 50); }
function startSearch(q) {
  const el = document.getElementById('start-apps'); if (!el) return;
  const filtered = APPS.filter(a => a.name.toLowerCase().includes(q.toLowerCase()));
  el.innerHTML = filtered.map(app => `<div class="mw-start-app" onclick="openApp('${app.id}')">${Ico[app.icon] || Ico.file}<span>${app.name}</span></div>`).join('') || '<div style="padding:20px;color:var(--text2);text-align:center">No apps found</div>';
}

// ═══════════════════════════════════════════════════
// Main Render
// ═══════════════════════════════════════════════════
function render() {
  const root = document.getElementById('mw-root');
  if (bootStage === 'bios') {
    root.innerHTML = renderBios();
    return;
  }
  if (bootStage === 'logo') {
    root.innerHTML = renderBootLogo();
    return;
  }
  if (!state.booted) {
    root.innerHTML = renderBoot();
  } else {
    root.innerHTML = renderDesktop();
    // Initialize canvas-based apps
    state.windows.forEach(w => {
      if (w.appId === 'game2d' && !w.min) setTimeout(() => gsInit(w.id), 10);
    });
  }
}

document.documentElement.style.setProperty('--accent', state.settings.accent || '#ff8c00');
startBootSequence();

// Close start menu on outside click
document.addEventListener('click', () => { if (state.startOpen) { state.startOpen = false; render(); } });

// Online/offline detection
window.addEventListener('online', () => notify('Back online'));
window.addEventListener('offline', () => notify('Offline mode'));
</script>
